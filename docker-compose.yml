# Local development stack (spec 12 §1). Credentials here are local-only placeholders.
# Host ports avoid the usual defaults (other local stacks often hold 5432/6379); override via env.
name: advolevel

x-backend-env: &backend-env
  APP_ENV: local
  DATABASE_URL: postgresql://advolevel_app:advolevel_app@db:5432/advolevel
  REDIS_URL: redis://redis:6379/0
  CORS_ORIGINS: http://localhost:3000
  S3_ENDPOINT: http://s3:8333
  S3_BUCKET: advolevel-local
  DEBUG_ENDPOINTS_ENABLED: "true"
  APP_BASE_URL: http://localhost:3000
  EMAIL_PROVIDER: smtp
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  # Clerk (DEC-006), from the root .env. Unset = authenticated endpoints answer 503.
  AUTH_ISSUER: ${AUTH_ISSUER:-}
  AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-}
  AUTH_WEBHOOK_SECRET: ${AUTH_WEBHOOK_SECRET:-}
  AUTH_AUTHORIZED_PARTIES: http://localhost:3000
  SENTRY_DSN: ${SENTRY_DSN:-}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: advolevel
      POSTGRES_PASSWORD: advolevel
      POSTGRES_DB: advolevel
    ports: ["127.0.0.1:${POSTGRES_HOST_PORT:-5442}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U advolevel -d advolevel"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:${REDIS_HOST_PORT:-6390}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Local S3-compatible storage. MinIO images are no longer published on Docker Hub, so we use
  # SeaweedFS's S3 gateway. Anonymous access, local only; buckets are created by the app (M4).
  s3:
    image: chrislusf/seaweedfs:4.48
    command: server -dir=/data -s3 -s3.port=8333 -master.volumeSizeLimitMB=256
    ports: ["127.0.0.1:${S3_HOST_PORT:-8333}:8333"]
    volumes: [s3data:/data]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/status"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Local SMTP sink for invitation emails (OQ-029 pending). Inbox UI: http://127.0.0.1:8025
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:${MAILPIT_UI_HOST_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_HOST_PORT:-1025}:1025"

  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *backend-env
      # Owner credentials go to the migration job only; the API runs as advolevel_app.
      DATABASE_MIGRATION_URL: postgresql://advolevel:advolevel@db:5432/advolevel
    depends_on:
      db: { condition: service_healthy }

  api:
    build: ./backend
    environment: *backend-env
    ports: ["127.0.0.1:${API_HOST_PORT:-8000}:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      s3: { condition: service_healthy }
      mailpit: { condition: service_started }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  s3data:
