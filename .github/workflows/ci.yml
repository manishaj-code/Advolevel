# PR gates (spec 12 §4). Deploy stages are added once hosting is decided (OQ-014).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy app tests
      - run: uv run pytest
      - name: OpenAPI contract committed for the frontend is current
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
          REDIS_URL: redis://127.0.0.1:6379/0
        run: |
          uv run python -m app.openapi ../frontend/lib/api/openapi.json
          git diff --exit-code ../frontend/lib/api/openapi.json

  backend-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: advolevel
          POSTGRES_PASSWORD: advolevel
          POSTGRES_DB: advolevel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U advolevel -d advolevel"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://advolevel_app:advolevel_app@127.0.0.1:5432/advolevel
      DATABASE_MIGRATION_URL: postgresql://advolevel:advolevel@127.0.0.1:5432/advolevel
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true
      - run: uv sync --locked
      - name: Create roles
        run: psql "$DATABASE_MIGRATION_URL" -v ON_ERROR_STOP=1 -f ../infra/postgres/init/01-roles.sql
      - run: uv run alembic upgrade head
      - run: uv run alembic downgrade base && uv run alembic upgrade head
      - run: uv run pytest -m integration

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Generated API types are current
        run: npm run api:types && git diff --exit-code lib/api/schema.d.ts
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Dev-only advisories are tracked in TECHNICAL_DEBT.md; production deps must stay clean.
      - run: npm audit --omit=dev --audit-level=high

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The gitleaks GitHub Action needs a paid licence for organisation repos (KI-006), so run the CLI.
      - name: gitleaks
        env:
          GITLEAKS_VERSION: "8.24.2"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git . --redact --verbose
