# Install once: `uvx pre-commit install`. Hooks call the project's own tool versions (uv.lock,
# package-lock.json) so local results match CI.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run --directory backend ruff format
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: ruff-check
        name: ruff check
        entry: uv run --directory backend ruff check --fix
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: prettier
        name: prettier
        entry: npm --prefix frontend run format
        language: system
        files: ^frontend/
        pass_filenames: false
